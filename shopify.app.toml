
client_id = "be3c9e9d877f34648cf8a21bc790dbd5"
name = "TrackMe"
application_url = "https://timocetrackme.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "read_all_orders,write_products,read_orders,write_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_customers"

[auth]
redirect_urls = [
  "https://timocetrackme.onrender.com/auth/callback",
  "https://timocetrackme.onrender.com/auth/shopify/callback",
  "https://timocetrackme.onrender.com/api/auth/callback"
]
